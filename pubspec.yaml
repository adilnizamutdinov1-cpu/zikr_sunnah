name: zikr_sunnah
description: "Зикр по Сунне — красивый, спокойный и полностью офлайн цифровой тасбих для ежедневного зикра."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local storage (Hive, store Maps — no codegen adapters needed)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animation
  flutter_animate: ^4.5.0

  # Date & Time
  intl: ^0.20.2
  table_calendar: ^3.1.3

  # File operations (backup export/import)
  file_picker: ^8.1.0
  share_plus: ^10.0.2

  # Utilities
  collection: ^1.18.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - l10n/
